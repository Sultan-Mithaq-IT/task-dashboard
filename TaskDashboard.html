<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Task Tracker — Executive Dashboard</title>
<meta http-equiv="refresh" content="300">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0d14; --surface:#111520; --surface2:#161b28; --surface3:#1c2233;
    --border:rgba(255,255,255,0.07); --text:#e8eaf2; --text-muted:#6b7390;
    --accent:#4f8ef7; --accent2:#7c5cfc; --urgent:#f74f4f; --high:#f7954f;
    --med:#f7d44f; --low:#4ff78a; --completed:#4ff78a; --inprogress:#4f8ef7;
    --font-head:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}
  header{position:relative;padding:28px 40px 22px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#0d1120,#111826);display:flex;align-items:center;justify-content:space-between;z-index:10}
  .logo-area{display:flex;align-items:center;gap:14px}
  .logo-dot{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:800;font-size:16px;color:#fff}
  .logo-text{font-family:var(--font-head);font-size:20px;font-weight:700;letter-spacing:-.3px}
  .logo-text span{color:var(--text-muted);font-weight:400;font-size:13px;display:block;margin-top:1px}
  .live-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(79,247,138,.08);border:1px solid rgba(79,247,138,.2);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--completed);font-family:var(--font-head);font-weight:600}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--completed);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  main{padding:32px 40px;position:relative;z-index:1}
  
  /* Filter Styles */
  .filter-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:28px}
  .filter-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);font-family:var(--font-head);font-weight:600;margin-bottom:6px}
  .multi-select-toggle{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;width:100%;text-align:left;}
  
  /* KPI Cards */
  .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;position:relative;}
  .kpi-value{font-family:var(--font-head);font-size:32px;font-weight:800;margin-bottom:4px}
  
  /* VARIED CHART STYLES */
  .charts-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:24px}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px}
  .chart-title{font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:18px}

  /* Style 1: Horizontal Progress Bars (Company) */
  .bar-list{display:flex;flex-direction:column;gap:12px}
  .bar-fill{height:6px;background:var(--accent);border-radius:3px;transition:width 0.8s;}

  /* Style 2: Workload Chips (Assignee) */
  .assignee-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .assignee-stat-card{background:var(--surface2);padding:12px;border-radius:8px;border:1px solid var(--border);text-align:center}
  .astat-val{display:block;font-size:18px;font-weight:700;font-family:var(--font-head)}
  .astat-name{display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-top:4px}

  /* Style 3: Ranked List (Service Type) */
  .rank-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
  .rank-item:last-child{border-bottom:none}
  .rank-name{font-size:13px;display:flex;align-items:center;gap:8px}
  .rank-num{color:var(--accent);font-weight:700;font-family:var(--font-head)}

  .table-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{padding:12px 16px;text-align:left;font-size:10px;text-transform:uppercase;color:var(--text-muted);background:var(--surface2)}
  td{padding:12px 16px;font-size:12.5px;border-bottom:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <div class="logo-area">
    <div class="logo-dot">IT</div>
    <div class="logo-text">Task Tracker <span>Executive Operations Dashboard</span></div>
  </div>
  <div class="header-right">
    <div class="live-badge"><div class="live-dot"></div> LIVE DATA</div>
  </div>
</header>
<main>
  <div class="filter-bar" id="filters">
    </div>

  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Total</div><div class="kpi-value" id="kTotal">—</div></div>
    <div class="kpi-card"><div class="kpi-label">Done</div><div class="kpi-value" id="kCompleted" style="color:var(--completed)">—</div></div>
    <div class="kpi-card"><div class="kpi-label">Active</div><div class="kpi-value" id="kInProgress" style="color:var(--inprogress)">—</div></div>
    <div class="kpi-card"><div class="kpi-label">Urgent</div><div class="kpi-value" id="kUrgent" style="color:var(--urgent)">—</div></div>
    <div class="kpi-card"><div class="kpi-label">Clients</div><div class="kpi-value" id="kCompanies">—</div></div>
  </div>

  <div class="charts-row">
    <div class="chart-card">
        <div class="chart-title">Tasks by Company</div>
        <div class="bar-list" id="companyChart"></div>
    </div>
    <div class="chart-card">
        <div class="chart-title">Priority Distribution</div>
        <div style="display:flex; align-items:center; gap:20px">
            <svg width="100" height="100" viewBox="0 0 100 100"><g id="donutSegments" transform="translate(50,50)"></g></svg>
            <div id="donutLegend" style="font-size:12px"></div>
        </div>
    </div>
    <div class="chart-card">
        <div class="chart-title">Assignee Workload</div>
        <div class="assignee-grid" id="assigneeChart"></div>
        <div class="chart-title" style="margin-top:25px; margin-bottom:10px">Top Service Types</div>
        <div id="serviceChart"></div>
    </div>
  </div>

  <div class="table-card">
    <table>
      <thead><tr><th>Date</th><th>Task</th><th>Company</th><th>Priority</th><th>Status</th><th>Assignee</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

const COLORS=['#4f8ef7','#7c5cfc','#f74f4f','#f7954f','#4ff78a','#f7d44f'];

function countBy(arr, k) {
    const m = {};
    arr.forEach(d => {
        let val = d[k] ? d[k].toString().trim() : "";
        if(val && val !== "None") {
            m[val] = (m[val] || 0) + 1;
        }
    });
    return m;
}

function render() {
    const t = RAW_DATA.length;
    document.getElementById('kTotal').textContent = t;
    document.getElementById('kCompleted').textContent = RAW_DATA.filter(d=>d.status==='Completed').length;
    document.getElementById('kInProgress').textContent = RAW_DATA.filter(d=>d.status!=='Completed').length;
    document.getElementById('kUrgent').textContent = RAW_DATA.filter(d=>d.priority==='Urgent').length;
    document.getElementById('kCompanies').textContent = Object.keys(countBy(RAW_DATA, 'company')).length;

    // 1. Company Chart (Horizontal Bars)
    const comps = Object.entries(countBy(RAW_DATA, 'company')).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const maxC = comps[0][1];
    document.getElementById('companyChart').innerHTML = comps.map(([n,v]) => `
        <div style="margin-bottom:10px">
            <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px"><span>${n}</span><b>${v}</b></div>
            <div style="height:6px; background:var(--surface3); border-radius:3px"><div class="bar-fill" style="width:${(v/maxC)*100}%"></div></div>
        </div>
    `).join('');

    // 2. Assignee Chart (Grid Cards)
    const asgn = Object.entries(countBy(RAW_DATA, 'assignee')).sort((a,b)=>b[1]-a[1]).slice(0,4);
    document.getElementById('assigneeChart').innerHTML = asgn.map(([n,v]) => `
        <div class="assignee-stat-card">
            <span class="astat-val" style="color:${COLORS[Math.floor(Math.random()*COLORS.length)]}">${v}</span>
            <span class="astat-name">${n}</span>
        </div>
    `).join('');

    // 3. Service Chart (Ranked List)
    const svcs = Object.entries(countBy(RAW_DATA, 'service_type')).sort((a,b)=>b[1]-a[1]).slice(0,5);
    document.getElementById('serviceChart').innerHTML = svcs.map(([n,v]) => `
        <div class="rank-item">
            <div class="rank-name"><span class="rank-num">#</span> ${n}</div>
            <div style="font-weight:700; font-size:12px">${v}</div>
        </div>
    `).join('');

    // 4. Donut Chart (Simplified)
    const prios = countBy(RAW_DATA, 'priority');
    const pOrder = ['Urgent', 'High', 'Med', 'Low'];
    let htmlL = "";
    pOrder.forEach(p => {
        if(prios[p]) htmlL += `<div><span style="color:var(--${p.toLowerCase()})">●</span> ${p}: ${prios[p]}</div>`;
    });
    document.getElementById('donutLegend').innerHTML = htmlL;

    // 5. Table
    document.getElementById('tableBody').innerHTML = RAW_DATA.slice(0,20).map(d=>`
        <tr>
            <td>${d.date_entered}</td>
            <td>${d.task}</td>
            <td>${d.company}</td>
            <td style="color:var(--${d.priority.toLowerCase()})">${d.priority}</td>
            <td>${d.status}</td>
            <td>${d.assignee}</td>
        </tr>
    `).join('');
}

render();
</script>
